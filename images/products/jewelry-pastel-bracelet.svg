<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <rect width="300" height="300" rx="28" fill="#fdf2f8"/>
        <circle cx="150" cy="150" r="95" fill="#fbcfe8" opacity="0.4"/>
